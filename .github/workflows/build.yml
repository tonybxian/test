name: apollo 内核

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "LineageOS内核分支，须与手机ROM对应"
        required: true
        default: "lineage-24.0"
      defconfig:
        description: "defconfig名，留空自动查找apollo/apollon"
        required: false
        default: ""
      ksu_branch:
        description: "FinaSU分支"
        required: false
        default: "main"

permissions:
  contents: write

env:
  KBRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}
  DEFCFG: ${{ github.event.inputs.defconfig }}
  KSUBR: ${{ github.event.inputs.ksu_branch || 'main' }}
  KSU_REPO: "https://github.com/LyraVoid/FinaSU"
  NOMOUNT_REPO: "https://github.com/backslashxx/nomount"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 1.安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex cpio zip unzip perl rsync \
            libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 2.下载编译器
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip -q clang.zip
          mv proton-clang-master proton-clang
          rm -f clang.zip
          echo "$PWD/proton-clang/bin" >> "$GITHUB_PATH"

      - name: 3.拉源码并集成FinaSU+SUSFS+NoMount+手动hook
        run: |
          git clone --depth=1 -b "$KBRANCH" https://github.com/LineageOS/android_kernel_xiaomi_sm8250 kernel || {
            echo "❌ 分支不存在，现有分支："
            git ls-remote --heads https://github.com/LineageOS/android_kernel_xiaomi_sm8250 | awk '{print $2}'
            exit 1
          }
          cd kernel

          # ---------- 找 defconfig ----------
          if [ -n "$DEFCFG" ]; then
            CFG=$(find arch/arm64/configs -name "$DEFCFG" | head -n1)
          else
            CFG=$(find arch/arm64/configs \( -iname '*apollo*' -o -iname '*apollon*' \) -name '*_defconfig' | sort | head -n1)
          fi
          if [ -z "$CFG" ]; then
            echo "❌ 没找到defconfig，以下是全部："
            find arch/arm64/configs -name '*_defconfig'
            exit 1
          fi
          echo "✅ defconfig: $CFG"
          echo "CFGFILE=$CFG" >> "$GITHUB_ENV"
          echo "MAKECFG=${CFG#arch/arm64/configs/}" >> "$GITHUB_ENV"

          # ---------- FinaSU ----------
          echo "===== FinaSU ====="
          curl -LSsf "https://raw.githubusercontent.com/LyraVoid/FinaSU/${KSUBR}/kernel/setup.sh" | bash -s "$KSUBR" || true
          if [ ! -d KernelSU/kernel ]; then
            echo "setup.sh异常，手动克隆"
            rm -rf KernelSU
            git clone --depth=1 -b "$KSUBR" "$KSU_REPO" KernelSU || git clone --depth=1 "$KSU_REPO" KernelSU
          fi
          echo "---- FinaSU README（如有非GKI说明请阅读日志）----"
          head -n 150 KernelSU/README.md 2>/dev/null || true

          # ---------- SUSFS ----------
          echo "===== SUSFS ====="
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu susfs \
            || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu susfs
          if [ -d susfs/kernel_patches/fs ]; then cp -a susfs/kernel_patches/fs/. fs/; fi
          if [ -d susfs/kernel_patches/include ]; then cp -a susfs/kernel_patches/include/. include/; fi
          P50=$(find susfs -name '50_add_susfs_in_kernel*4.19*' -name '*.patch' | head -n1)
          if [ -n "$P50" ]; then
            if git apply --check "$P50" 2>/dev/null; then
              git apply "$P50"; echo "✅ susfs 4.19 内核补丁已应用"
            else
              echo "⚠️ susfs 4.19 补丁上下文不匹配，隐藏能力可能不完整"
            fi
          else
            echo "⚠️ 未找到4.19的susfs补丁"
          fi
          for d in FinaSU SukiSU-Ultra KernelSU-Next KernelSU; do
            PD=$(find susfs -type d -name "$d" | head -n1)
            if [ -z "$PD" ]; then continue; fi
            PF=$(find "$PD" -name '*.patch' | head -n1)
            if [ -z "$PF" ]; then continue; fi
            echo "尝试KSU侧susfs补丁: $PF"
            if (cd KernelSU && git apply --check "../$PF"); then
              (cd KernelSU && git apply "../$PF")
              echo "✅ KSU侧susfs补丁($d)已应用"; break
            else
              echo "⚠️ $d 补丁不匹配，换下一个"
            fi
          done

          # ---------- 并入 drivers/kernelsu ----------
          rm -rf drivers/kernelsu
          cp -a KernelSU/kernel drivers/kernelsu
          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q 'kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            printf 'config KSU\n\tbool "KernelSU"\n\tdefault y\n\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' > drivers/kernelsu/Kconfig
          fi

          # ---------- NoMount（非GKI：内核集成） ----------
          echo "===== NoMount ====="
          git clone --depth=1 "$NOMOUNT_REPO" nomount_repo || echo "⚠️ NoMount克隆失败"
          if [ -d nomount_repo ]; then
            for r in nomount_repo/README.md nomount_repo/kernel/README.md; do
              if [ -f "$r" ]; then echo "---- $r ----"; head -n 150 "$r"; fi
            done
            if [ -d nomount_repo/kernel ]; then
              mkdir -p fs/nomount
              cp -a nomount_repo/kernel/. fs/nomount/
              for p in $(find nomount_repo -name '*.patch' -not -path '*/.git/*'); do
                if git apply --check "$p" 2>/dev/null; then
                  git apply "$p"; echo "✅ 应用 $(basename "$p")"
                else
                  echo "- 跳过 $(basename "$p")（上下文不匹配）"
                fi
              done
              if [ -f fs/nomount/Makefile ] && [ -f fs/nomount/Kconfig ]; then
                if ! grep -q 'nomount' fs/Makefile; then echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile; fi
                if ! grep -q 'nomount/Kconfig' fs/Kconfig; then echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig; fi
                echo "CONFIG_NOMOUNT=y" >> "$CFG"
                echo "✅ NoMount已按通用方式并入"
              else
                echo "⚠️ nomount/kernel非标准kbuild结构，请按日志里README的non-GKI说明，在本步骤补几行cp/sed/patch后重跑"
              fi
            else
              echo "⚠️ 仓库无kernel/目录，请阅读上面日志里的README后补充集成步骤"
            fi
          fi

          # ---------- 非GKI手动hook（exec/faccessat/vfs_read） ----------
          echo "===== 手动hook ====="
          python3 - <<'PYEOF' || echo "HOOKS_FAILED=1" >> "$GITHUB_ENV"
import re, os, shutil, sys

def load(p):
    with open(p, encoding='utf-8', errors='surrogateescape') as f:
        return f.read()

def save(p, s):
    with open(p, 'w', encoding='utf-8', errors='surrogateescape') as f:
        f.write(s)

def find_pos(src, start, pattern):
    m = re.search(pattern, src[start:])
    return -1 if not m else start + m.end()

def insert_after(src, pos, code):
    nl = src.find('\n', pos)
    if nl < 0:
        nl = len(src) - 1
    return src[:nl+1] + code + src[nl+1:]

FILES = ['fs/exec.c', 'fs/open.c', 'fs/read_write.c']

def hook_exec():
    p = 'fs/exec.c'
    src = load(p)
    if 'ksu_handle_execveat' in src:
        print('[hooks] exec.c: 已有hook，跳过'); return True
    m = re.search(r'static\s+int\s+(do_execveat_common|__do_execve_file)\s*\(', src)
    if not m:
        print('[hooks] exec.c: 找不到目标函数'); return False
    fn = m.group(1)
    sig = src[m.start():src.find('{', m.end())]
    if 'struct filename *filename' not in sig:
        print('[hooks] exec.c: %s 形参非struct filename，需人工适配' % fn); return False
    fd = 'fd' if re.search(r'\bint\s+fd\b', sig) else None
    flags = 'flags' if re.search(r'\bint\s+flags\b', sig) else None
    argv = '__argv' if '__argv' in sig else 'argv'
    envp = '__envp' if '__envp' in sig else 'envp'
    if not fd or not flags:
        print('[hooks] exec.c: 形参识别失败'); return False
    ext = ('#ifdef CONFIG_KSU\n'
           'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n'
           '\t\t\tvoid *envp, int *flags);\n'
           'extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,\n'
           '\t\t\tvoid *argv, void *envp, int *flags);\n'
           '#endif\n\n')
    call = ('#ifdef CONFIG_KSU\n'
            '\tksu_handle_execveat(&%s, &filename, &%s, &%s, &%s);\n'
            '\tksu_handle_execveat_sucompat(&%s, &filename, &%s, &%s, &%s);\n'
            '#endif\n') % (fd, argv, envp, flags, fd, argv, envp, flags)
    src = src[:m.start()] + ext + src[m.start():]
    pos = find_pos(src, m.start(), r'if \(IS_ERR\(filename\)\)[^\n]*\n\s*return\s+PTR_ERR\(filename\);')
    if pos < 0:
        b = src.find('{', src.find('static int ' + fn))
        de = src.find('\n\n', b)
        if de < 0:
            print('[hooks] exec.c: 插入点识别失败'); return False
        src = src[:de+2] + call + src[de+2:]; save(p, src)
        print('[hooks] exec.c ✓(兜底位置)'); return True
    src = insert_after(src, pos, call); save(p, src)
    print('[hooks] exec.c ✓'); return True

def hook_open():
    p = 'fs/open.c'
    src = load(p)
    if 'ksu_handle_faccessat' in src:
        print('[hooks] open.c: 已有hook，跳过'); return True
    m = re.search(r'static\s+(?:long|int)\s+do_faccessat\s*\(', src)
    if not m:
        print('[hooks] open.c: 找不到do_faccessat'); return False
    ext = ('#ifdef CONFIG_KSU\n'
           'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
           '\t\t\tint *mode, int *flags);\n'
           '#endif\n\n')
    call = ('#ifdef CONFIG_KSU\n'
            '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
            '#endif\n')
    src = src[:m.start()] + ext + src[m.start():]
    pos = find_pos(src, m.start(), r'if \(mode & ~S_IRWXO\)[^\n]*\n\s*return\s+-EINVAL;')
    if pos < 0:
        b = src.find('{', src.find('do_faccessat'))
        de = src.find('\n\n', b)
        if de < 0:
            print('[hooks] open.c: 插入点识别失败'); return False
        src = src[:de+2] + call + src[de+2:]; save(p, src)
        print('[hooks] open.c ✓(兜底位置)'); return True
    src = insert_after(src, pos, call); save(p, src)
    print('[hooks] open.c ✓'); return True

def hook_read():
    p = 'fs/read_write.c'
    src = load(p)
    if 'ksu_handle_vfs_read' in src:
        print('[hooks] read_write.c: 已有hook，跳过'); return True
    m = re.search(r'\nssize_t\s+vfs_read\s*\(', src)
    if not m:
        print('[hooks] read_write.c: 找不到vfs_read'); return False
    st = m.start() + 1
    ext = ('#ifdef CONFIG_KSU\n'
           'extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n'
           '\t\t\tsize_t *count_ptr, loff_t **pos);\n'
           '#endif\n\n')
    call = ('#ifdef CONFIG_KSU\n'
            '\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n'
            '#endif\n')
    src = src[:st] + ext + src[st:]
    pos = find_pos(src, st, r'if \(!\(file->f_mode & FMODE_READ\)\)\s*\n\s*return\s+-EBADF;')
    if pos < 0:
        b = src.find('{', src.find('ssize_t vfs_read'))
        de = src.find('\n\n', b)
        if de < 0:
            print('[hooks] read_write.c: 插入点识别失败'); return False
        src = src[:de+2] + call + src[de+2:]; save(p, src)
        print('[hooks] read_write.c ✓(兜底位置)'); return True
    src = insert_after(src, pos, call); save(p, src)
    print('[hooks] read_write.c ✓'); return True

ok = True
for f in FILES:
    if not os.path.exists(f):
        print('[hooks] 缺少 %s' % f); ok = False
if ok:
    for f in FILES:
        if not os.path.exists(f + '.ksuorig'):
            shutil.copy(f, f + '.ksuorig')
    for fn in (hook_exec, hook_open, hook_read):
        try:
            if not fn():
                ok = False
        except Exception as e:
            print('[hooks] 异常: %r' % e); ok = False
if not ok:
    for f in FILES:
        if os.path.exists(f + '.ksuorig'):
            shutil.copy(f + '.ksuorig', f)
    print('[hooks] ❌ 失败已回滚，将回退kprobes模式')
    sys.exit(1)
print('[hooks] ✅ 三处手动hook全部成功(manual模式)')
PYEOF

          # ---------- defconfig ----------
          grep -vE '^(CONFIG_KSU|# CONFIG_KSU|CONFIG_KPROBES|# CONFIG_KPROBES)' "$CFG" > "$CFG.new" && mv "$CFG.new" "$CFG"
          printf '\n# --- FinaSU/SUSFS/NoMount ---\nCONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\n# CONFIG_KPROBES is not set\n' >> "$CFG"
          echo "✅ 集成完成"

      - name: 4.编译
        working-directory: kernel
        run: |
          if [ "${HOOKS_FAILED:-0}" = "1" ]; then
            echo "⚠️ 手动hook失败→kprobes回退模式(可用但隐蔽性差)"
            echo "CONFIG_KPROBES=y" >> "$CFGFILE"
          fi
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" "$MAKECFG"
          if grep -q '^CONFIG_KSU=y' out/.config; then echo "✅ CONFIG_KSU=y"; else echo "❌ CONFIG_KSU未生效，集成有问题"; exit 1; fi
          grep '^CONFIG_KSU_SUSFS=y' out/.config || echo "⚠️ CONFIG_KSU_SUSFS未生效(KSU侧susfs补丁可能没打上)"
          grep '^CONFIG_KPROBES=y' out/.config >/dev/null && echo "ℹ️ kprobes模式" || echo "ℹ️ manual hook模式"
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" -j"$(nproc)"
          cat out/include/generated/utsrelease.h 2>/dev/null || true
          ls out/arch/arm64/boot/ || true

      - name: 5.打包AnyKernel3
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          if [ -f ../out/arch/arm64/boot/Image.gz ]; then
            cp ../out/arch/arm64/boot/Image.gz .
          elif [ -f ../out/arch/arm64/boot/Image ]; then
            cp ../out/arch/arm64/boot/Image .
          else
            echo "❌ 未找到内核镜像"; exit 1
          fi
          zip -r9 ../apollo_finasu_susfs_nomount.zip .
          ls -la ../apollo_finasu_susfs_nomount.zip

      - name: 6.上传Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apollo_finasu_susfs_nomount
          path: kernel/apollo_finasu_susfs_nomount.zip
          if-no-files-found: error

      - name: 7.发布Release(手机可直接下载)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            "kernel/apollo_finasu_susfs_nomount.zip" \
            --title "apollo-FinaSU-SUSFS-NoMount build-${GITHUB_RUN_NUMBER}" \
            --notes "自动构建，仅限apollo(K30S至尊纪念版/Mi10T系列)。只刷内核镜像，dtb/dtbo沿用ROM自带。刷前请备份boot分区！"
