name: apollo-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "LineageOS内核分支，必须与手机ROM一致"
        required: true
        default: "lineage-24.0"
      defconfig:
        description: "defconfig名，留空自动查找apollo"
        required: false
        default: ""
      ksu_repo:
        description: "KSU分支仓库 owner/repo"
        required: false
        default: "LyraVoid/FinaSU"

permissions:
  contents: write

env:
  KBRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-24.0' }}
  DEFCFG: ${{ github.event.inputs.defconfig }}
  KSUREPO: ${{ github.event.inputs.ksu_repo || 'LyraVoid/FinaSU' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 0.检出仓库
        uses: actions/checkout@v4

      - name: 1.安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex cpio zip unzip perl rsync patch \
            libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 2.下载编译器
        run: |
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          unzip -q clang.zip
          mv proton-clang-master proton-clang
          rm -f clang.zip
          echo "$PWD/proton-clang/bin" >> "$GITHUB_PATH"
          mv proton-clang/bin/ld proton-clang/bin/ld.disabled

      - name: 3.拉源码并集成FinaSU+SUSFS+NoMount+手动hook
        run: |
          git clone --depth=1 -b "$KBRANCH" https://github.com/LineageOS/android_kernel_xiaomi_sm8250 kernel || {
            echo "::error::分支 $KBRANCH 不存在，可用分支如下："
            git ls-remote --heads https://github.com/LineageOS/android_kernel_xiaomi_sm8250 | awk '{print $2}' || true
            exit 1
          }
          cd kernel

          echo "===== 找defconfig ====="
          if [ -n "$DEFCFG" ]; then
            CFG=$(find arch/arm64/configs -name "${DEFCFG}*" | head -n1)
          else
            CFG=$(find arch/arm64/configs -iname '*apollo*defconfig' | sort | head -n1)
          fi
          if [ -z "$CFG" ]; then
            echo "::error::没找到apollo的defconfig，现有全部："
            find arch/arm64/configs -name '*_defconfig' || true
            exit 1
          fi
          echo "✅ defconfig: $CFG"
          echo "CFGFILE=$CFG" >> "$GITHUB_ENV"
          echo "MAKECFG=${CFG#arch/arm64/configs/}" >> "$GITHUB_ENV"

          echo "===== FinaSU ====="
          if ! git clone --depth=1 --recurse-submodules "https://github.com/$KSUREPO" KernelSU; then
            echo "::error::克隆 https://github.com/$KSUREPO 失败，请检查参数 ksu_repo 填的 owner/repo"
            exit 1
          fi
          if [ ! -d KernelSU/kernel ]; then
            echo "::error::$KSUREPO 里没有 kernel/ 目录，不是标准KSU结构"
            exit 1
          fi
          echo "---- 以下是该仓库README前60行 ----"
          head -n 60 KernelSU/README.md 2>/dev/null || true

          echo "===== SUSFS ====="
          if ! git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs; then
            if ! git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs; then
              echo "::warning::susfs克隆失败，本次构建不含SUSFS"
            fi
          fi
          if [ -d susfs/kernel_patches ]; then
            P50=$(find susfs -name '*susfs*4.19*.patch' | head -n1)
            if [ -n "$P50" ]; then
              if git apply --check "$P50" 2>/dev/null; then
                git apply "$P50"
                echo "✅ susfs 4.19 内核补丁已应用"
              elif patch -p1 -F3 --no-backup-if-mismatch --dry-run < "$P50" >/dev/null 2>&1; then
                patch -p1 -F3 --no-backup-if-mismatch < "$P50" >/dev/null 2>&1
                echo "⚠️ susfs补丁以fuzz方式应用"
              else
                echo "::warning::susfs 4.19补丁不匹配，隐藏能力可能不完整"
              fi
            else
              echo "::warning::没找到4.19的susfs补丁"
            fi
            if [ -d susfs/kernel_patches/fs ]; then
              ( cd susfs/kernel_patches/fs && find . -type f ) | while read -r f; do
                if [ ! -f "fs/$f" ]; then
                  cp "susfs/kernel_patches/fs/$f" "fs/$f"
                  echo "ℹ️ 补齐缺失文件 fs/$f"
                fi
              done
            fi
            if [ -d susfs/kernel_patches/include/linux ]; then
              ( cd susfs/kernel_patches/include/linux && find . -type f ) | while read -r f; do
                if [ ! -f "include/linux/$f" ]; then
                  cp "susfs/kernel_patches/include/linux/$f" "include/linux/$f"
                fi
              done
            fi
            PF=""
            for d in FinaSU SukiSU-Ultra KernelSU-Next KernelSU; do
              T=$(find susfs/kernel_patches -type d -name "$d" | head -n1)
              if [ -n "$T" ]; then
                PF=$(find "$T" -name '*.patch' | head -n1)
                if [ -n "$PF" ]; then break; fi
              fi
            done
            if [ -z "$PF" ]; then
              PF=$(find susfs/kernel_patches -maxdepth 1 \( -name '10_*.patch' -o -name '69_*.patch' \) | head -n1)
            fi
            if [ -n "$PF" ]; then
              echo "KSU侧susfs补丁: $PF"
              if patch -d KernelSU -p1 -F3 --dry-run < "$PF" >/dev/null 2>&1; then
                patch -d KernelSU -p1 -F3 --no-backup-if-mismatch < "$PF" >/dev/null 2>&1
                echo "✅ KSU侧susfs补丁已应用"
              else
                echo "::warning::KSU侧补丁不匹配(该分支可能已内置susfs)"
              fi
            fi
          fi


          echo "===== 4.19兼容:MODULE_IMPORT_NS ====="
          grep -rl 'MODULE_IMPORT_NS(' KernelSU/kernel | while read -r f; do
            # 跳过本来就定义了兼容宏的头文件，避免自引用
            grep -q '#define MODULE_IMPORT_NS' "$f" && continue
            sed -i 's|^\([[:space:]]*MODULE_IMPORT_NS([^)]*);[[:space:]]*\)$|#ifdef MODULE_IMPORT_NS\n\1\n#endif|' "$f"
          done

          echo "===== 4.19兼容补丁: iopoll/remap_file_range ====="
          python3 - <<'PYEOF'
          import re
          p = 'KernelSU/kernel/infra/file_wrapper.c'
          s = open(p).read()
          # 1) iopoll 的 bool-spin 旧分支: #else 改成 #elif >=5.1, 4.19 下不编译
          sig = 'ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)'
          i = s.find(sig)
          assert i != -1, 'iopoll signature not found'
          c = [m for m in re.finditer(r'(?m)^#else\b.*$', s[:i]) if i - m.end() < 500]
          assert c, 'iopoll #else not found'
          m = c[-1]
          s = s[:m.start()] + '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)' + s[m.end():]
          # 2) 给 p->ops.xxx = ... 的赋值行加版本守卫
          def guard_line(pat, ver):
              pre = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(%s)' % ver
              return re.sub(r'(?m)^([^\n]*\b' + pat + r'[^\n]*)$', pre + '\n\\1\n#endif', s)
          s = guard_line(r'ops\.iopoll\s*=', '5, 1, 0')
          s = guard_line(r'ops\.remap_file_range\s*=', '4, 20, 0')
          # 3) remap_file_range 整个函数加守卫(函数体内的 REMAP_FILE_DEDUP 一并解决)
          def wrap_func(name, ver):
              m = re.search(r'(?m)^static [^\n]*\b' + name + r'\s*\(', s)
              assert m, name + ' not found'
              b = s.index('{', m.end()); d = 0; k = b
              while True:
                  d += (s[k] == '{') - (s[k] == '}')
                  if d == 0:
                      break
                  k += 1
              e = s.index('\n', k) + 1
              return (s[:m.start()]
                      + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(%s)\n' % ver
                      + s[m.start():e] + '#endif\n' + s[e:])
          s = wrap_func('ksu_wrapper_remap_file_range', '4, 20, 0')
          open(p, 'w').write(s)
          print('file_wrapper.c patched OK')
          PYEOF

          echo "===== 4.19兼容: seccomp_cache ====="
          python3 - <<'PYEOF'
          p = 'KernelSU/kernel/infra/seccomp_cache.c'
          s = open(p).read()
          if 'KERNEL_VERSION(5, 9, 0)' not in s:
              head = ('#include <linux/version.h>\n'
                      '#include <linux/types.h>\n'
                      '#include <linux/seccomp.h>\n'
                      '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n')
              tail = ('#else\n'
                      '/* seccomp cache needs 5.9+; no-op stubs for old kernels */\n'
                      'void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) { }\n'
                      'void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) { }\n'
                      '#endif\n')
              open(p, 'w').write(head + s + tail)
              print('seccomp_cache.c patched OK')
          else:
              print('seccomp_cache.c already patched, skip')
          PYEOF

          echo "===== 4.19兼容: su_mount_ns ====="
          python3 - <<'PYEOF'
          p = 'KernelSU/kernel/infra/su_mount_ns.c'
          s = open(p).read()
          if '__has_include' not in s:
              s = s.replace('#include <uapi/linux/mount.h>',
                  '#if __has_include(<uapi/linux/mount.h>)\n'
                  '#include <uapi/linux/mount.h>\n'
                  '#else\n'
                  '#include <linux/fs.h>\n'
                  '#include <linux/mount.h>\n'
                  '#endif\n', 1)
              open(p, 'w').write(s)
              print('su_mount_ns.c patched OK')
          else:
              print('su_mount_ns.c already patched, skip')
          PYEOF


          echo "===== 4.19兼容: pkg_observer ====="
          python3 - <<'PYEOF'
          import re, sys
          p = 'KernelSU/kernel/manager/pkg_observer.c'
          s = open(p).read()
          if 'KERNEL_VERSION(5, 9, 0)' in s:
              print('pkg_observer.c already patched, skip')
              sys.exit(0)
          # 1) TWA_RESUME 是 5.11 才有; 旧内核 task_work_add 第3参传 true
          pat = re.compile(r'(?m)^(?P<i>[ \t]*)(?P<s>if \(!task_work_add\(current, cb, TWA_RESUME\)\).*)$')
          m = pat.search(s)
          assert m, 'task_work_add line not found'
          i, t = m.group('i'), m.group('s')
          blk = (i + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
              + i + t + '\n'
              + i + '#else\n'
              + i + 'if (!task_work_add(current, cb, true))\n'
              + i + '#endif\n')
          s = s[:m.start()] + blk + s[m.end():]
          # 2) <5.9 没有 handle_inode_event, 换成 handle_event 老签名
          c = [
              '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)',
              '#include <linux/string.h>',
              'static int ksu_handle_inode_event_old(struct fsnotify_group *group, struct inode *inode,',
              '                                      u32 mask, const void *data, int data_type,',
              '                                      const unsigned char *file_name, u32 cookie,',
              '                                      struct fsnotify_iter_info *iter_info)',
              '{',
              '    (void)group; (void)inode; (void)data; (void)data_type;',
              '    (void)cookie; (void)iter_info;',
              '    if (!file_name)',
              '        return 0;',
              '    if (mask & FS_ISDIR)',
              '        return 0;',
              '    if (strlen(file_name) == 13 && !memcmp(file_name, "packages.list", 13)) {',
              '        pr_info("packages.list detected: %d\\n", mask);',
              '        ksu_defer_track_throne();',
              '    }',
              '    return 0;',
              '}',
              '#endif',
              '',
              'static const struct fsnotify_ops ksu_ops = {',
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)',
              '    .handle_inode_event = ksu_handle_inode_event,',
              '#else',
              '    .handle_event = ksu_handle_inode_event_old,',
              '#endif',
              '};',
          ]
          new2 = '\n'.join(c) + '\n'
          m = re.search(r'(?s)static const struct fsnotify_ops ksu_ops = \{.*?\};', s)
          assert m, 'ksu_ops struct not found'
          s = s[:m.start()] + new2 + s[m.end():]
          open(p, 'w').write(s)
          print('pkg_observer.c patched OK')
          PYEOF


          echo "===== 4.19兼容: 全局扫TWA_RESUME ====="
          python3 - <<'PYEOF'
          import re, glob, sys
          fixed = []
          pat = re.compile(r'(?m)^(?P<i>[ \t]*)(?P<s>.*task_work_add\([^;]*TWA_RESUME[^;]*\).*)$')
          for p in glob.glob('KernelSU/kernel/**/*.c', recursive=True):
              s = open(p).read()
              if 'TWA_RESUME' not in s or 'KERNEL_VERSION(5, 11, 0)' in s:
                  continue
              def repl(m):
                  i, t = m.group('i'), m.group('s')
                  return (i + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                          + i + t + '\n'
                          + i + '#else\n'
                          + i + t.replace('TWA_RESUME', 'true') + '\n'
                          + i + '#endif')
              new_s, n = pat.subn(repl, s)
              if n:
                  if '#include <linux/version.h>' not in new_s:
                      m2 = re.search(r'(?m)^#include', new_s)
                      new_s = new_s[:m2.start()] + '#include <linux/version.h>\n' + new_s[m2.start():]
                  open(p, 'w').write(new_s)
                  fixed.append('%s (%d处)' % (p, n))
          print('TWA_RESUME fixed:', fixed if fixed else 'no more occurrences')
          PYEOF


          echo "===== 4.19兼容: app_profile seccomp字段 ====="
          python3 - <<'PYEOF'
          import re, sys
          p = 'KernelSU/kernel/policy/app_profile.c'
          s = open(p).read()
          if 'KERNEL_VERSION(5, 5, 0)' in s:
              print('app_profile.c already patched, skip')
              sys.exit(0)
          # 1) filter_count 是 5.5 加的; 4.19 没有, 裁掉该行
          pat = re.compile(r'(?m)^(?P<i>[ \t]*)(?P<s>[^\n]*seccomp\.filter_count[^\n]*)$')
          m = pat.search(s)
          assert m, 'filter_count line not found'
          i = m.group('i')
          blk = (i + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 5, 0)\n'
                 + i + m.group('s') + '\n'
                 + i + '#else\n'
                 + i + '/* 4.19: no filter_count; ref-count handles cleanup */\n'
                 + i + '#endif\n')
          s = s[:m.start()] + blk + s[m.end():]
          # 2) seccomp_cache 相关调用 (5.9+) 一并守卫
          for name in ('ksu_seccomp_clear_cache', 'ksu_seccomp_allow_cache'):
              cnt = len(re.findall(r'(?m)^[ \t]*' + name + r'\(', s))
              if cnt:
                  s = re.sub(r'(?m)^(?P<i>[ \t]*)(?P<s>[ \t]*' + name + r'\([^\n]*\);[ \t]*)$',
                             lambda m: (m.group('i') + '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n'
                                        + m.group('s') + '\n' + m.group('i') + '#endif\n'), s)
                  print('guarded', name, 'x%d' % cnt)
          open(p, 'b' and 'w').write(s)
          print('app_profile.c patched OK')
          PYEOF

          echo "===== 4.19兼容: selinux 5.6 API v3 ====="
          python3 - <<'PYEOF'
          import re, sys

          V = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 6, 0)'

          def rep(s, old, new, need, tag):
              n = s.count(old)
              assert n == need, '%s: hit %d, expect %d' % (tag, n, need)
              return s.replace(old, new)

          p = 'KernelSU/kernel/selinux/rules.c'
          s = open(p).read()
          if 'KERNEL_VERSION(5, 6, 0)' in s:
              print('rules.c already patched, skip')
          else:
              s = rep(s,
                  '    struct selinux_policy *pol, *old_pol;\n    struct policydb *db;\n',
                  '    ' + V + '\n'
                + '    struct selinux_policy *pol, *old_pol;\n'
                + '    struct policydb *db;\n'
                + '#else\n'
                + '    struct policydb *db;\n'
                + '#endif\n', 2, 'decl')
              pat = re.compile(r'    old_pol = rcu_dereference_protected.*?    db = &pol->policydb;\n', re.S)
              hits = pat.findall(s)
              assert len(hits) == 2, 'regionA: hit %d, expect 2' % len(hits)
              s = pat.sub(lambda m: '    ' + V + '\n' + m.group(0)
                          + '#else\n    db = &selinux_state.ss->policydb;\n#endif\n', s)
              s = rep(s,
                  '    rcu_assign_pointer(selinux_state.policy, pol);\n    synchronize_rcu();\n    ksu_destroy_sepolicy(old_pol);\n',
                  '    ' + V + '\n'
                + '    rcu_assign_pointer(selinux_state.policy, pol);\n'
                + '    synchronize_rcu();\n'
                + '    ksu_destroy_sepolicy(old_pol);\n'
                + '#else\n'
                + '    /* 4.19: rules applied in place, nothing to swap */\n'
                + '#endif\n', 2, 'swap')
              s = rep(s,
                  'out_unlock:\n    mutex_unlock(&selinux_state.policy_mutex);\n',
                  'out_unlock:\n    ' + V + '\n'
                + '    mutex_unlock(&selinux_state.policy_mutex);\n'
                + '#else\n'
                + '    write_unlock_irq(&selinux_state.ss->policy_rwlock);\n'
                + '#endif\n', 2, 'unlock')
              s = rep(s,
                  'out_drop_new_policy:\n    ksu_destroy_sepolicy(pol);\n',
                  'out_drop_new_policy:\n    ' + V + '\n'
                + '    ksu_destroy_sepolicy(pol);\n'
                + '#else\n'
                + '    ;\n'
                + '#endif\n', 1, 'drop')
              open(p, 'w').write(s)
              print('rules.c patched OK')

          p = 'KernelSU/kernel/selinux/sepolicy.c'
          s = open(p).read()
          if 'KERNEL_VERSION(5, 6, 0)' in s:
              print('sepolicy.c already patched, skip')
          else:
              i = s.index('void ksu_destroy_sepolicy')
              j = s.index('struct selinux_policy *ksu_dup_sepolicy')
              assert i < j, 'order changed'
              k = s.index('{', j)
              d = 0
              while True:
                  d += (s[k] == '{') - (s[k] == '}')
                  if d == 0:
                      break
                  k += 1
              e = s.index('\n', k) + 1
              block = s[i:e]
              stub = ('    ' + V + '\n'
                    + block.rstrip('\n') + '\n'
                    + '#else\n'
                    + 'void ksu_destroy_sepolicy(struct selinux_policy *pol) { (void)pol; }\n'
                    + 'struct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *old_pol) { (void)old_pol; return NULL; }\n'
                    + '#endif\n')
              open(p, 'w').write(s[:i] + stub + s[e:])
              print('sepolicy.c patched OK')
          PYEOF

          echo "===== 4.19兼容: selinux lock补丁 ====="
          python3 - <<'PYEOF'
          V = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 6, 0)'
          p = 'KernelSU/kernel/selinux/rules.c'
          s = open(p).read()
          marker = V + '\n    mutex_lock(&selinux_state.policy_mutex);\n'
          if marker in s:
              print('rules.c lock already patched, skip')
          else:
              old = '    mutex_lock(&selinux_state.policy_mutex);\n'
              new = ('    ' + V + '\n'
                   + '    mutex_lock(&selinux_state.policy_mutex);\n'
                   + '#else\n'
                   + '    write_lock_irq(&selinux_state.ss->policy_rwlock);\n'
                   + '#endif\n')
              n = s.count(old)
              assert n == 2, 'lock: hit %d, expect 2' % n
              s = s.replace(old, new)
              open(p, 'w').write(s)
              print('rules.c lock patched OK (%d处)' % n)
          PYEOF


          echo "===== 4.19兼容: sepolicy flex_array v1 ====="
          python3 - <<'PYEOF'
          import sys

          p = 'KernelSU/kernel/selinux/sepolicy.c'
          s = open(p).read()
          MARK = '/* KSU-419-SEPOLICY */'
          if MARK in s:
              print('sepolicy.c already patched, skip')
              sys.exit(0)

          def find_def(src, prefix):
              start = 0
              while True:
                  i = src.find(prefix, start)
                  assert i != -1, 'function not found: ' + prefix
                  j = src.find(';', i)
                  k = src.find('{', i)
                  if k != -1 and (j == -1 or k < j):
                      return i
                  start = i + 1

          def brace_end(src, start):
              k = src.index('{', start)
              d = 0
              while True:
                  d += (src[k] == '{') - (src[k] == '}')
                  if d == 0:
                      return k
                  k += 1

          def wrap_fn(src, prefix, gate, stub, tag):
              i = find_def(src, prefix)
              k = brace_end(src, i)
              e = src.index('\n', k) + 1
              body = src[i:e]
              return src[:i] + gate + '\n' + body + '#else\n' + stub + '\n#endif\n' + src[e:]

          V1 = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)'
          V9 = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)'
          V6 = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 6, 0)'

          # 1) remove_avtab_node: 4.19 的 avtab.htable 是 flex_array, 守卫+stub
          s = wrap_fn(s, 'static bool remove_avtab_node(', V1,
              'static bool remove_avtab_node(struct policydb *db, struct avtab_node *node)\n'
              '{\n'
              '    (void)db;\n'
              '    (void)node;\n'
              '    return false;\n'
              '}', 'remove_avtab_node')

          # 2) add_filename_trans: 5.9 API, 守卫+stub
          s = wrap_fn(s, 'static bool add_filename_trans(', V9,
              'static bool add_filename_trans(struct policydb *db, const char *s, const char *t, const char *c, const char *d, const char *o)\n'
              '{\n'
              '    (void)db; (void)s; (void)t; (void)c; (void)d; (void)o;\n'
              '    return false;\n'
              '}', 'add_filename_trans')

          # 3) add_type: 5.1+ 保留 FinaSU 实现; 4.19 用原版 KernelSU v0.9.5 的 flex_array 实现
          A1 = ('    if (symtab_insert(&db->p_types, key, type)) {\n'
                '        pr_err("add_type: insert symtab failed.\\n");\n'
                '        return false;\n'
                '    }\n')
          n = s.count(A1)
          assert n == 1, 'add_type anchor: hit %d, expect 1' % n
          i = s.index(A1)
          j = find_def(s, 'static bool add_type(')
          k = brace_end(s, j)
          assert i < k, 'add_type anchor outside body'
          mid = s[i + len(A1):k]
          R = '    return true;\n'
          assert mid.endswith(R), 'add_type tail unexpected'
          assert mid.count(R) == 1, 'add_type return true: %d' % mid.count(R)
          head = mid[:-len(R)]
          FA_BODY = (
          '    // flex_array is not extensible, we need to create a new bigger one instead\n'
          '    struct flex_array *new_type_attr_map_array =\n'
          '        flex_array_alloc(sizeof(struct ebitmap), db->p_types.nprim,\n'
          '                         GFP_ATOMIC | __GFP_ZERO);\n'
          '    struct flex_array *new_type_val_to_struct =\n'
          '        flex_array_alloc(sizeof(struct type_datum *), db->p_types.nprim,\n'
          '                         GFP_ATOMIC | __GFP_ZERO);\n'
          '    struct flex_array *new_val_to_name_types =\n'
          '        flex_array_alloc(sizeof(char *), db->symtab[SYM_TYPES].nprim,\n'
          '                         GFP_ATOMIC | __GFP_ZERO);\n'
          '    if (!new_type_attr_map_array) {\n'
          '        pr_err("add_type: alloc type_attr_map_array failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    if (!new_type_val_to_struct) {\n'
          '        pr_err("add_type: alloc type_val_to_struct failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    if (!new_val_to_name_types) {\n'
          '        pr_err("add_type: alloc val_to_name failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    // preallocate so we don\'t have to worry about the put ever failing\n'
          '    if (flex_array_prealloc(new_type_attr_map_array, 0, db->p_types.nprim,\n'
          '                            GFP_ATOMIC | __GFP_ZERO)) {\n'
          '        pr_err("add_type: prealloc type_attr_map_array failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    if (flex_array_prealloc(new_type_val_to_struct, 0, db->p_types.nprim,\n'
          '                            GFP_ATOMIC | __GFP_ZERO)) {\n'
          '        pr_err("add_type: prealloc type_val_to_struct failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    if (flex_array_prealloc(new_val_to_name_types, 0,\n'
          '                            db->symtab[SYM_TYPES].nprim,\n'
          '                            GFP_ATOMIC | __GFP_ZERO)) {\n'
          '        pr_err("add_type: prealloc val_to_name_types failed\\n");\n'
          '        return false;\n'
          '    }\n'
          '    int j;\n'
          '    void *old_elem;\n'
          '    // copy the old data or pointers to new flex arrays\n'
          '    for (j = 0; j < db->type_attr_map_array->total_nr_elements; j++) {\n'
          '        old_elem = flex_array_get(db->type_attr_map_array, j);\n'
          '        if (old_elem)\n'
          '            flex_array_put(new_type_attr_map_array, j, old_elem,\n'
          '                           GFP_ATOMIC | __GFP_ZERO);\n'
          '    }\n'
          '    for (j = 0; j < db->type_val_to_struct_array->total_nr_elements; j++) {\n'
          '        old_elem = flex_array_get_ptr(db->type_val_to_struct_array, j);\n'
          '        if (old_elem)\n'
          '            flex_array_put_ptr(new_type_val_to_struct, j, old_elem,\n'
          '                               GFP_ATOMIC | __GFP_ZERO);\n'
          '    }\n'
          '    for (j = 0; j < db->symtab[SYM_TYPES].nprim; j++) {\n'
          '        old_elem =\n'
          '            flex_array_get_ptr(db->sym_val_to_name[SYM_TYPES], j);\n'
          '        if (old_elem)\n'
          '            flex_array_put_ptr(new_val_to_name_types, j, old_elem,\n'
          '                               GFP_ATOMIC | __GFP_ZERO);\n'
          '    }\n'
          '    // store the pointer of old flex arrays, when assigning new ones we\n'
          '    // should free it\n'
          '    struct flex_array *old_fa;\n'
          '    old_fa = db->type_attr_map_array;\n'
          '    db->type_attr_map_array = new_type_attr_map_array;\n'
          '    if (old_fa) {\n'
          '        flex_array_free(old_fa);\n'
          '    }\n'
          '    ebitmap_init(flex_array_get(db->type_attr_map_array, value - 1));\n'
          '    ebitmap_set_bit(flex_array_get(db->type_attr_map_array, value - 1),\n'
          '                    value - 1, 1);\n'
          '    old_fa = db->type_val_to_struct_array;\n'
          '    db->type_val_to_struct_array = new_type_val_to_struct;\n'
          '    if (old_fa) {\n'
          '        flex_array_free(old_fa);\n'
          '    }\n'
          '    flex_array_put_ptr(db->type_val_to_struct_array, value - 1, type,\n'
          '                       GFP_ATOMIC | __GFP_ZERO);\n'
          '    old_fa = db->sym_val_to_name[SYM_TYPES];\n'
          '    db->sym_val_to_name[SYM_TYPES] = new_val_to_name_types;\n'
          '    if (old_fa) {\n'
          '        flex_array_free(old_fa);\n'
          '    }\n'
          '    flex_array_put_ptr(db->sym_val_to_name[SYM_TYPES], value - 1, key,\n'
          '                       GFP_ATOMIC | __GFP_ZERO);\n'
          '    int i;\n'
          '    for (i = 0; i < db->p_roles.nprim; ++i) {\n'
          '        ebitmap_set_bit(&db->role_val_to_struct[i]->types, value - 1, 1);\n'
          '    }\n')
          s = (s[:i + len(A1)] + V1 + '\n' + head
               + '#else\n' + FA_BODY + '#endif\n' + R + s[k:])

          # 4) add_typeattribute_raw: sattr 行按版本分流
          S1 = '    struct ebitmap *sattr = &db->type_attr_map_array[type->value - 1];\n'
          n = s.count(S1)
          assert n == 1, 'sattr: hit %d, expect 1' % n
          s = s.replace(S1,
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n' + S1
            + '#else\n'
            + '    struct ebitmap *sattr =\n'
            + '        flex_array_get(db->type_attr_map_array, type->value - 1);\n'
            + '#endif\n')

          # 5) dup/destroy: 若之前 v3 的 sepolicy 部分没打上, 这里补上
          if 'ksu_dup_sepolicy(struct selinux_policy *old_pol) { (void)old_pol; return NULL; }' not in s:
              i = s.index('void ksu_destroy_sepolicy')
              j = s.index('struct selinux_policy *ksu_dup_sepolicy')
              assert i < j, 'dup/destroy order changed'
              k = brace_end(s, j)
              e = s.index('\n', k) + 1
              block = s[i:e]
              stubs = ('void ksu_destroy_sepolicy(struct selinux_policy *pol) { (void)pol; }\n'
                       'struct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *old_pol) { (void)old_pol; return NULL; }\n')
              s = s[:i] + V6 + '\n' + block + '#else\n' + stubs + '#endif\n' + s[e:]
              print('dup/destroy wrapped')
          else:
              print('dup/destroy already guarded')

          inc = '#include "sepolicy.h"\n'
          assert s.count(inc) == 1, 'include anchor: %d' % s.count(inc)
          s = s.replace(inc, inc + MARK + '\n')
          open(p, 'w').write(s)
          print('sepolicy.c patched OK')
          PYEOF






          

          

          echo "===== 并入 drivers/kernelsu ====="
          rm -rf drivers/kernelsu
          ln -sf ../KernelSU/kernel drivers/kernelsu


          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q 'kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            printf 'config KSU\n\tbool "KernelSU"\n\tdefault y\n\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' > drivers/kernelsu/Kconfig
          fi

          echo "===== NoMount(非GKI内核集成) ====="
          if git clone --depth=1 https://github.com/backslashxx/nomount.git nomount_repo; then
            for r in nomount_repo/README.md nomount_repo/kernel/README.md; do
              if [ -f "$r" ]; then
                echo "---- $r 前80行 ----"
                head -n 80 "$r"
              fi
            done
            if [ -d nomount_repo/kernel ]; then
              mkdir -p fs/nomount
              cp -a nomount_repo/kernel/. fs/nomount/
              find nomount_repo -name '*.patch' -not -path '*/.git/*' | while read -r p; do
                if git apply --check "$p" 2>/dev/null; then
                  git apply "$p"
                  echo "✅ 应用补丁 $(basename "$p")"
                elif patch -p1 -F3 --no-backup-if-mismatch --dry-run < "$p" >/dev/null 2>&1; then
                  patch -p1 -F3 --no-backup-if-mismatch < "$p" >/dev/null 2>&1
                  echo "⚠️ fuzz应用 $(basename "$p")"
                else
                  echo "ℹ️ 跳过 $(basename "$p")"
                fi
              done
              if [ -f fs/nomount/Makefile ] && [ -f fs/nomount/Kconfig ]; then
                grep -q 'nomount' fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
                grep -q 'nomount/Kconfig' fs/Kconfig || echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
                echo "CONFIG_NOMOUNT=y" >> "$CFG"
                echo "✅ NoMount按通用kbuild方式并入"
              else
                echo "::warning::nomount/kernel非标准结构——对照上方README日志，在本步骤补几行命令后重跑"
              fi
            else
              echo "::warning::nomount仓库没有kernel/目录，请读上方日志后补充集成步骤"
            fi
          else
            echo "::warning::nomount克隆失败"
          fi

          echo "===== 手动hook(非GKI) ====="
          if python3 "$GITHUB_WORKSPACE/hooks.py"; then
            echo "✅ 手动hook注入成功"
          else
            echo "HOOKS_FAILED=1" >> "$GITHUB_ENV"
            echo "::warning::手动hook失败，编译时回退kprobes模式"
          fi

          echo "===== defconfig ====="
          grep -vE '^(CONFIG_KSU|# CONFIG_KSU|CONFIG_KPROBES|# CONFIG_KPROBES)' "$CFG" > "$CFG.new" && mv "$CFG.new" "$CFG"
          printf '\n# --- KSU/SUSFS/NoMount ---\nCONFIG_KSU=y\nCONFIG_KSU_SUSFS=y\n# CONFIG_KPROBES is not set\n' >> "$CFG"
          echo "✅ 集成完成"

      - name: 4.编译
        working-directory: kernel
        run: |
          if [ "${HOOKS_FAILED:-0}" = "1" ]; then
            echo "CONFIG_KPROBES=y" >> "$CFGFILE"
            echo "ℹ️ 回退kprobes模式"
          fi
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" "$MAKECFG"
          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo "✅ CONFIG_KSU=y 已生效"
          else
            echo "::error::CONFIG_KSU未生效，集成失败"
            exit 1
          fi
          if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "✅ CONFIG_KSU_SUSFS=y 已生效"
          else
            echo "::warning::CONFIG_KSU_SUSFS未生效(susfs补丁可能没打上)"
          fi
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" -j"$(nproc)"
          ls -la out/arch/arm64/boot/ || true

      - name: 5.打包AnyKernel3
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git .github README.md
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh || true
          KIMG=""
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "../out/arch/arm64/boot/$f" ]; then
              cp "../out/arch/arm64/boot/$f" ./"$f"
              KIMG="$f"
              break
            fi
          done
          if [ -z "$KIMG" ]; then
            echo "::error::没找到内核镜像"
            ls -la ../out/arch/arm64/boot/ || true
            exit 1
          fi
          echo "内核镜像: $KIMG"
          zip -r9 ../apollo_finasu_susfs_nomount.zip . >/dev/null
          ls -la ../apollo_finasu_susfs_nomount.zip

      - name: 6.上传Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apollo_finasu_susfs_nomount
          path: kernel/apollo_finasu_susfs_nomount.zip
          if-no-files-found: error

      - name: 7.发布Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            "kernel/apollo_finasu_susfs_nomount.zip" \
            --title "apollo kernel build-${GITHUB_RUN_NUMBER}" \
            --notes "自动构建：FinaSU+SUSFS+NoMount。仅限apollo(K30S至尊纪念版)，刷前备份boot！" \
            || echo "::warning::发布Release失败，请改从Artifact下载"
